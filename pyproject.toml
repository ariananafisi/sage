[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sage"
version = "0.1.0"
description = "A single Claude agent that finds performance bottlenecks in LULESH and CoMD with Linux perf"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["claude-agent-sdk>=0.2.140", "PyYAML>=6", "jsonschema>=4.18"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
bottleneck-agent = "sage.agent:main"

[tool.setuptools]
packages = ["sage"]

[tool.setuptools.package-data]
sage = ["findings.schema.json"]
