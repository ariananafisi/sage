# Evaluation suite for CoMD: bottleneck-agent eval --suite suites/comd.yaml
# Each case runs on a fresh copy of the pinned source (configs/comd.yaml), changed by its patch.
name: comd
target: comd
config: ../configs/comd.yaml
# False positives: an injected bottleneck type reported for an injection site (a function the suite's patches
# change) in a case that did not inject it there. Natural findings in other functions are not counted.
false_positive_types: [load_imbalance, memory_latency_bound, memory_bandwidth_bound]
injection_sites: [ljForce]
cases:
  - id: negative-control
    description: Unmodified pinned source, MPI build with the config's rank count (the same setup as load-imbalance).
    mpi: true
    expect: none
  - id: load-imbalance
    description: >-
      Rank 0 does extra work at the end of ljForce every step; the other ranks wait for it in the next
      communication.
    patch: patches/comd-load-imbalance.patch
    mpi: true
    expect:
      function: ljForce
      bottleneck_types: [load_imbalance]
  - id: memory-bound
    description: >-
      Every atom in ljForce follows a chain of dependent, scattered reads through a 256 MB table (far larger
      than the caches) each step, so the kernel waits on memory. Serial build, like the config's default run.
    patch: patches/comd-memory-bound.patch
    expect:
      function: ljForce
      bottleneck_types: [memory_latency_bound, memory_bandwidth_bound]
