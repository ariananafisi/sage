# Evaluation suite for LULESH: bottleneck-agent eval --suite suites/lulesh.yaml
# Each case runs on a fresh copy of the pinned source (configs/lulesh.yaml), changed by its patch.
#
# Ground truth for the unmodified code is the roofline study by Afzal, Hager and Wellein
# (references/lulesh-afzal2024.yaml): five of the six OpenMP hot spots are memory-bound, and
# CalcKinematicsForElems is the only one that is not.
name: lulesh
target: lulesh
config: ../configs/lulesh.yaml
# The study's settings: load imbalance off (-b 0 -c 0) and a working set (~1.5 GB at -s 120) beyond
# the last-level cache; the reference's conditions (in its file) say how far beyond, and how many
# threads, for its classification to apply. Fewer iterations than its 300 keep a run near 25 s on
# 4 cores; the classification is per iteration. To score against the reference, run on a node like the
# study's: bottleneck-agent eval --suite suites/lulesh.yaml --env OMP_NUM_THREADS=<cores per domain>
run: "{binary} -s 120 -i 40 -b 0 -c 0"
# False positives: a case reporting a bottleneck that another case injects (its function and type).
cases:
  - id: negative-control
    description: >-
      Unmodified pinned source. Scored against the reference: for each of the six hot functions the agent
      reports, its memory-bound / not-memory-bound classification must match the study's.
    expect: none
    reference: {file: references/lulesh-afzal2024.yaml, variant: openmp}
  - id: load-imbalance
    description: >-
      Extra work for the first quarter of elements in the CalcFBHourglassForceForElems OpenMP loop.
      With OpenMP's static schedule, all of it lands on thread 0 while the other threads wait.
    patch: patches/lulesh-load-imbalance.patch
    expect:
      function: CalcFBHourglassForceForElems
      bottleneck_types: [load_imbalance]
  - id: memory-bound
    description: >-
      Every element of CalcKinematicsForElems, the one hot spot the reference finds not memory-bound,
      follows a chain of dependent, scattered reads through a table of 64 entries per element (1 GiB at
      -s 120, 16 MiB at -s 30), which makes it memory-bound: its cost per element drops once the
      table fits in cache.
    patch: patches/lulesh-memory-bound.patch
    expect:
      function: CalcKinematicsForElems
      bottleneck_types: [memory_latency_bound, memory_bandwidth_bound]
