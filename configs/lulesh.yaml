# LULESH 2.0, Livermore Unstructured Lagrangian Explicit Shock Hydrodynamics.
# Build commands and the binary path are relative to .work/lulesh/; the checkout is .work/lulesh/src.
target: lulesh
repo_url: https://github.com/LLNL/LULESH.git
commit: 3e01c40b3281aadb7f996525cdd4a3354f6d3801  # master, 2020-11-18
build:
  # Serial (no MPI) + OpenMP, optimized, with symbols and frame pointers for perf call graphs.
  # CMAKE_POLICY_VERSION_MINIMUM lets CMake >= 4 accept the project's cmake_minimum_required(3.0).
  - >-
    cmake -S src -B build -DCMAKE_BUILD_TYPE=Release -DWITH_MPI=OFF -DWITH_OPENMP=ON
    -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_CXX_FLAGS="-g -fno-omit-frame-pointer"
  - cmake --build build -j
binary: build/lulesh2.0
# -s: elements per edge, -i: iterations. About 10 s on 4 cores.
run: "{binary} -s 50 -i 300"
env:
  OMP_NUM_THREADS: 4
  OMP_PROC_BIND: "true"
